name: Build Sandbox

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Python component to build
        required: true
        default: python313
        type: choice
        options:
          - python313
          - python314

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.package || 'python313' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHON_PACKAGE: ${{ inputs.package || 'python313' }}
      NIX_CONFIG: |
        accept-flake-config = true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        uses: ./.github/actions/free-disk

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Restore Nix binary cache
        id: nix-binary-cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/nix-binary-cache
          key: nix-sandbox-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nix-sandbox-v2-${{ runner.os }}-
            nix-sandbox-v1-${{ runner.os }}-
            nix-python-v2-${{ runner.os }}-
            nix-python-v1-${{ runner.os }}-

      - name: Register GitHub binary cache
        if: always() && steps.nix-binary-cache.outcome == 'success'
        shell: bash
        run: |
          mkdir -p /tmp/nix-binary-cache
          {
            echo 'NIX_CONFIG<<EOF'
            echo 'accept-flake-config = true'
            echo 'extra-substituters = file:///tmp/nix-binary-cache?trusted=true'
            echo 'EOF'
          } >> "$GITHUB_ENV"

      # - name: Start tmate session
      #   uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
      #   with:
      #     detached: true
      #     limit-access-to-actor: true

      - name: Resolve sandbox derivations
        id: sandbox-build
        shell: bash
        run: |
          wheel_set="${PYTHON_PACKAGE/python/py}"
          sandbox_target=".#sandboxWebc.$wheel_set"
          printf '%s\n' "$sandbox_target" > sandbox-webc-target
          printf '%s\n' "$sandbox_target" > sandbox-build-targets
          mapfile -t targets < sandbox-build-targets
          mapfile -t root_drvs < <(nix path-info --derivation "${targets[@]}" | sort -u)
          for root_drv in "${root_drvs[@]}"; do
            nix-store --query --requisites "$root_drv"
          done | grep '\.drv$' | sort -u > sandbox-build-drvs
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build sandbox closure
        id: sandbox-closure
        shell: bash
        run: |
          mapfile -t targets < sandbox-build-targets
          nix build --fallback --no-link "${targets[@]}"
          mapfile -t closure_drvs < sandbox-build-drvs
          nix build --fallback --no-link "${closure_drvs[@]}"

      - name: Collect sandbox WebC
        shell: bash
        run: |
          sandbox_target=$(cat sandbox-webc-target)
          mapfile -t outputs < <(nix path-info "$sandbox_target")
          test "${#outputs[@]}" -eq 1
          mkdir -p sandbox-webc-artifact
          cp "${outputs[0]}/sandbox.webc" sandbox-webc-artifact/sandbox.webc

      - name: Upload sandbox WebC
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-webc
          path: sandbox-webc-artifact/sandbox.webc
          if-no-files-found: error

      - name: Export Nix binary cache
        id: export-nix-binary-cache
        if: ${{ !cancelled() && steps.nix-binary-cache.outputs.cache-hit != 'true' && steps.sandbox-build.outputs.ready == 'true' && steps.sandbox-closure.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/nix-binary-cache
          closure=$(mktemp)
          candidates=$(mktemp)
          valid=$(mktemp)

          while IFS= read -r drv; do
            nix-store --query --requisites "$drv"
          done < sandbox-build-drvs | sort -u > "$closure"
          while IFS= read -r path; do
            echo "$path"
            case "$path" in
              *.drv) nix-store --query --outputs "$path" ;;
            esac
          done < "$closure" | sort -u > "$candidates"
          nix path-info --all | sort -u > "$valid"
          mapfile -t paths < <(comm -12 "$candidates" "$valid")
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No completed paths to cache"
            exit 0
          fi

          staging_cache=$(mktemp -d)
          nix copy --to "file://$staging_cache?compression=zstd" "${paths[@]}"
          rm -rf /tmp/nix-binary-cache
          mv "$staging_cache" /tmp/nix-binary-cache
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save Nix binary cache
        if: ${{ !cancelled() && steps.nix-binary-cache.outputs.cache-hit != 'true' && steps.export-nix-binary-cache.outputs.ready == 'true' && steps.sandbox-closure.outcome == 'success' }}
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/nix-binary-cache
          key: ${{ steps.nix-binary-cache.outputs.cache-primary-key }}
