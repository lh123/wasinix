name: CI command

# `/wasinix <command>` on a wasinix pull request. The pipeline lives in
# ci-command-run.yml, which any wasix-org repository can call with its own
# issue_comment event; this file is only wasinix's own trigger.
on:
  issue_comment:
    types: [created]

# Per comment, so every command is acknowledged and authorized; the heavy
# jobs carry their own per-PR serialization inside the pipeline.
concurrency:
  group:
    command-${{ github.repository_id }}-comment-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  command:
    # cheap pre-filter only; authorization decides for real
    if: >-
      github.event.issue.pull_request && contains(github.event.comment.body,
      '/wasinix')
    permissions:
      contents: write
      checks: write
      pull-requests: write
      # the timings job reads the run's own step records
      actions: read
    uses: ./.github/workflows/ci-command-run.yml
    secrets: inherit
