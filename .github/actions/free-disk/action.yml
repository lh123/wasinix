name: Free runner disk
description:
  Delete the runner image's preinstalled toolchains. Everything a build here
  needs comes from nix, so the Android, dotnet, Haskell, and hosted tool caches
  are only disk pressure under the nix store.
runs:
  using: composite
  steps:
    - name: Remove preinstalled toolchains
      shell: bash
      run: |
        echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') free"
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift \
          /usr/local/share/powershell \
          /usr/local/share/boost \
          /usr/local/lib/node_modules \
          /opt/hostedtoolcache
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        echo "after: $(df -h --output=avail / | tail -1 | tr -d ' ') free"

    # GitHub-hosted images carry a second, larger temp disk at /mnt; putting
    # the store there roughly triples its headroom. Depot runners have one
    # root volume, so the guard makes this a no-op for them. Must run before
    # nix is installed.
    - name: Put the nix store on the big disk
      shell: bash
      run: |
        root_free=$(df --output=avail / | tail -1)
        mnt_free=$(df --output=avail /mnt 2>/dev/null | tail -1 || echo 0)
        if [ "${mnt_free:-0}" -gt "$root_free" ]; then
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          echo "store on /mnt ($(df -h --output=avail /mnt | tail -1 | tr -d ' ') free)"
        else
          echo "store stays on / (no larger /mnt)"
        fi
