name: Free runner disk
description:
  Delete the runner image's preinstalled toolchains. Everything a build here
  needs comes from nix, so the Android, dotnet, Haskell, and hosted tool caches
  are only disk pressure under the nix store.
runs:
  using: composite
  steps:
    - name: Remove preinstalled toolchains
      shell: bash
      run: |
        echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') free"
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift \
          /usr/local/share/powershell \
          /usr/local/share/boost \
          /usr/local/lib/node_modules \
          /opt/hostedtoolcache
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        echo "after: $(df -h --output=avail / | tail -1 | tr -d ' ') free"
