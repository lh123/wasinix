name: Setup Nix
description:
  Install Nix with the wasinix cache configured and restore the flake-inputs
  cache. The nix config block is a verified copy of `wasinix ci nix-config` (the
  binary cannot run before Nix exists); a crate test fails when the two drift.
inputs:
  wasinix-binary:
    description:
      Make the wasinix binary ready in the store, from the actions cache when
      its sources are unchanged, building and re-caching it otherwise
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31.9.1
      with:
        extra_nix_config: |
          extra-substituters = https://nix-cache.wasix.org
          extra-trusted-public-keys = wasinix-1:jvsqbOJGsZxMvg97fuyNCWCc+t2nn6uHB47kQCGNmXI=
          trusted-users = root runner
          min-free = 10737418240
          max-free = 53687091200

    - name: Cache flake inputs
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        # The fetcher-cache sqlite is the index into the git and tarball
        # caches; without it every input re-downloads and re-unpacks each
        # run, the wasmer input slowest of all. It once pinned a divergent
        # narHash for a tree carrying a submodule gitlink (vendor/phpix),
        # which is gone from the tree; the key still pins the lock so a
        # bumped input starts a fresh entry.
        path: ~/.cache/nix
        # a saved cache is immutable (no re-save on an existing key), so
        # the key version bumps whenever the cached shape changes
        key: nix-flake-inputs-v3-${{ hashFiles('flake.lock') }}
        restore-keys: nix-flake-inputs-v3-

    - name: Cache the wasinix binary closure
      if: inputs.wasinix-binary == 'true'
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        # A file:// binary cache holding only the wasinix closure: an
        # actions-cache hit imports it at runner-local speed, beating both
        # the S3 substituter and a compile.
        path: ~/.cache/wasinix-bin
        key:
          wasinix-bin-v1-${{ hashFiles('tools/wasinix/**', 'flake.nix',
          'flake.lock') }}

    - name: Provide the wasinix binary
      if: inputs.wasinix-binary == 'true'
      shell: bash
      run: |
        store="file://$HOME/.cache/wasinix-bin"
        if [ -e "$HOME/.cache/wasinix-bin/nix-cache-info" ]; then
          nix copy --from "$store" --all --no-check-sigs
        fi
        nix build .#wasinix --no-link
        nix copy --to "$store" .#wasinix
